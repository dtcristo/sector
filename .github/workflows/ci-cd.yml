name: CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install native gamepad dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install just
        run: cargo install just --locked

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Test browser controls
        run: node --test tests/touch.test.mjs tests/gamepad.test.mjs

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --all --features "sector sector_edit doom_import"

      - name: Run tests
        run: cargo test --features "sector sector_edit doom_import"

      - name: Validate shipped maps
        run: |
          cargo run --bin sector_validate -- assets/maps/default.map.pb
          cargo run --bin sector_validate -- assets/maps/e1m1.map.pb

      - name: Build web bundle
        run: just build-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: wasm
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Brotli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends brotli

      - name: Prepare Pages assets
        run: scripts/prepare-pages-assets.sh dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=sector
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
