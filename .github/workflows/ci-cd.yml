name: CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install just
        run: cargo install just --locked

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.118 --locked

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --all --features "sector sector_edit doom_import"

      - name: Run tests
        run: cargo test --features "sector sector_edit doom_import"

      - name: Validate shipped maps
        run: |
          cargo run --bin sector_validate -- assets/maps/default.map.ron
          cargo run --bin sector_validate -- assets/maps/e1m1.map.ron

      - name: Build web bundle
        run: just build-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: wasm
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: sector
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
